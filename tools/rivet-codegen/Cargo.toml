[package]
name = "rivet-codegen"
version = "0.1.0"
edition = "2024"
description = "Vanilla data extraction + registry codegen for Rivet (epic #8). Excluded from the cargo workspace."

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
