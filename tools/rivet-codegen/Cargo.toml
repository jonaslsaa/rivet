[package]
name = "rivet-codegen"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Vanilla data extraction + registry codegen for Rivet (epic #8). Excluded from the cargo workspace."

[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

# Standalone workspace root (cargo's recommended fix for a package excluded from
# the parent workspace). Without this, cargo in a nested git worktree
# (`.claude/worktrees/...`) walks past this crate to the repository root's
# workspace, whose `exclude` glob does not match the nested path, and errors.
[workspace]
