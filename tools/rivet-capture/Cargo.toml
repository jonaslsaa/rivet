[package]
name = "rivet-capture"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Join-path packet-capture harness: captures the canonical protocol-776 offline-mode Paper join as deterministic byte fixtures (#153)"

[dependencies]
flate2 = { workspace = true }
rivet-decode = { path = "../rivet-decode" }
rivet-protocol = { workspace = true, features = ["packets"] }
rivet-registry = { workspace = true, features = ["blocks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { workspace = true }
