[package]
name = "rivet-client"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# Azalea currently requires nightly. Keep this tool out of Rivet's stable
# workspace and invoke it as a subprocess from rivet-oracle.
[workspace]

[dependencies]
azalea = { git = "https://github.com/azalea-rs/azalea", rev = "6249c295d353b9b3ef68f665b311cba39211fd19" }
# Shared std-only harness primitives (boot lifecycle, port reservations,
# strict transcripts, exit contract, negative controls). The crate is
# intentionally std-only, so this adds no external (non-std) packages to the
# dependency tree — only the crate itself is a new lockfile entry, letting the
# scenario runner depend on it across toolchains.
rivet-harness-common = { path = "../rivet-harness-common" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
