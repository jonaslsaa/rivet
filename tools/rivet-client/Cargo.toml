[package]
name = "rivet-client"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# Azalea currently requires nightly. Keep this tool out of Rivet's stable
# workspace and invoke it as a subprocess from rivet-oracle.
[workspace]

[dependencies]
azalea = { git = "https://github.com/azalea-rs/azalea", rev = "6249c295d353b9b3ef68f665b311cba39211fd19" }
# Shared harness primitives (boot lifecycle, port reservations, strict
# transcripts, exit contract, negative controls, and artifact provenance).
rivet-harness-common = { path = "../rivet-harness-common" }
getrandom = "0.4"
# Already in the lockfile (pulled by azalea-crypto), so this adds no new
# lockfile entries; the loaded-world acceptance harness fingerprints the
# read-only world copy with SHA-256.
sha2 = "0.11"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
