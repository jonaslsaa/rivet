[package]
name = "rivet-decode"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Decode/capture harness for the ported serverbound play packets (issue #97)"

[dependencies]
bytes = "1"
rivet-protocol = { path = "../../crates/rivet-protocol", features = ["packets"] }
rivet-registry = { path = "../../crates/rivet-registry" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
