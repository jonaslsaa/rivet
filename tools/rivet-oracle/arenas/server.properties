# Arena tick-trace Paper boot (tools/rivet-oracle/arenas/README.md). Superflat,
# no structures, never pauses when empty. Paper fills every other default on
# first boot; scripts/arena_trace_paper.sh rewrites server-port per run.
difficulty=easy
enable-status=false
generate-structures=false
level-name=world
level-seed=42
level-type=minecraft\:flat
max-chained-neighbor-updates=1000000
online-mode=false
pause-when-empty-seconds=-1
region-file-compression=none
server-port=25611
simulation-distance=4
spawn-protection=0
sync-chunk-writes=true
view-distance=4
