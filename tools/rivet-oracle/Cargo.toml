[package]
name = "rivet-oracle"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Differential-test harness: runs the Java Paper server, extracts golden fixtures"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# The #54 chunk-hash engine. xxhash-rust is declared at workspace scope with
# only the xxh3 feature (the #233 dep-scope commit); this crate inherits it.
# rivet-nbt + rivet-util are the proven byte-identical NBT codec used for the
# canonical re-encode and the NBT-aware mutations (semantic triage + tamper
# negatives).
xxhash-rust = { workspace = true }
rivet-nbt = { path = "../../crates/rivet-nbt" }
rivet-util = { path = "../../crates/rivet-util" }
# The loaded-world ground-truth extractor (#374) reads the overworld region
# files through rivet-world's read-only RegionFileStorage + section
# reconstruction, and names blocks through the generated rivet-registry block
# table. It is a pure read of the disposable world copy — never a write.
rivet-world = { path = "../../crates/rivet-world" }
rivet-registry = { path = "../../crates/rivet-registry", features = ["blocks"] }
# The composed-noise tamper negative control tampers a scratch copy so the
# committed golden is never mutated; TempDir guarantees the scratch dir is
# removed on every path.
tempfile = { workspace = true }
# Stable generated-FULL evidence acquisition is intentionally Linux-only:
# `openat2(2)` with RESOLVE_NO_SYMLINKS makes it atomic with respect to symlink
# substitution in every path component, and `/proc/self/fd` hands the opened
# Paper jar descriptor to unzip without reopening a mutable pathname.
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
