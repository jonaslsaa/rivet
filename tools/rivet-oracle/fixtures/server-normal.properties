#Minecraft server properties for the M2 normal-overworld region capture.
#Mirrors the M0 superflat config (fixtures/server.properties) except:
#  level-type=minecraft:normal (NoiseBasedChunkGenerator overworld)
#  view/simulation-distance=2 (minimal spawn slice: chunks -2..3, 6x6=36)
#  generate-structures=false   (pre-structure worldgen only; structures are
#                               wave 6 #182 / the #175 seed-walk gate)
#  spawn-monsters/animals/npcs=true (Paper defaults; MC 26.2 removed these keys
#                               — DedicatedServerProperties reads none of them,
#                               so setting them is a no-op. Entity spawning is
#                               actually suppressed via the pinned
#                               fixtures/paper-world-defaults.yml spawn-limits=0,
#                               copied into config/ every boot, issue #266)
#region-file-compression=none pins the byte-identity gate per DECISIONS D13.
#This config is captured verbatim into fixtures/regions/overworld-normal/
#so the region fixture records the exact generator settings it was made from.
accepts-transfers=false
allow-flight=false
allow-nether=true
broadcast-console-to-ops=true
broadcast-rcon-to-ops=true
bug-report-link=
chat-spam-threshold-seconds=10
command-spam-threshold-seconds=10
debug=false
difficulty=easy
enable-code-of-conduct=false
enable-command-block=false
enable-jmx-monitoring=false
enable-query=false
enable-rcon=false
enable-status=false
enforce-secure-profile=true
enforce-whitelist=false
entity-broadcast-range-percentage=100
force-gamemode=false
function-permission-level=2
gamemode=survival
generate-structures=false
generator-settings={}
hardcore=false
hide-online-players=false
initial-disabled-packs=
initial-enabled-packs=vanilla
level-name=world
level-seed=42
level-type=minecraft\:normal
log-ips=true
management-server-allowed-origins=
management-server-enabled=false
management-server-host=localhost
management-server-port=0
management-server-secret=
management-server-tls-enabled=true
management-server-tls-keystore=
management-server-tls-keystore-password=
max-chained-neighbor-updates=1000000
max-players=20
max-tick-time=60000
max-world-size=29999984
motd=Rivet M2 oracle fixture (normal overworld)
network-compression-threshold=256
online-mode=false
op-permission-level=4
pause-when-empty-seconds=-1
player-idle-timeout=0
prevent-proxy-connections=false
pvp=true
query.port=25565
rate-limit=0
rcon.password=
rcon.port=25575
region-file-compression=none
require-resource-pack=false
resource-pack=
resource-pack-id=
resource-pack-prompt=
resource-pack-sha1=
server-ip=
server-port=25599
simulation-distance=2
spawn-animals=true
spawn-monsters=true
spawn-npcs=true
spawn-protection=0
status-heartbeat-interval=0
sync-chunk-writes=true
text-filtering-config=
text-filtering-version=0
use-native-transport=true
view-distance=2
white-list=false
