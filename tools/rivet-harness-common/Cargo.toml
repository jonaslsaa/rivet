[package]
name = "rivet-harness-common"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Shared primitives for Rivet's E2E harness tools (child-process boot lifecycle, held port reservations, strict JSONL transcripts, exit contract, named negative controls, artifact provenance)"

[dependencies]
sha2 = "0.10"

# The test module exercises the generic policies against real JSON lines, so
# tests use serde_json.
[dev-dependencies]
serde_json = "1"
