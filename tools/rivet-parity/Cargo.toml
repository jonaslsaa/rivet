[package]
name = "rivet-parity"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Byte-for-byte NBT/SNBT parity diff between rivet-nbt and the Paper Java oracle"

[dependencies]
base64 = "0.22"
chrono = "0.4"
bytes = { workspace = true }
rivet-brigadier = { path = "../../crates/rivet-brigadier" }
rivet-harness-common = { path = "../rivet-harness-common" }
rivet-nbt = { path = "../../crates/rivet-nbt" }
rivet-protocol = { path = "../../crates/rivet-protocol", features = ["packets"] }
rivet-registry = { path = "../../crates/rivet-registry", features = ["blocks"] }
rivet-server = { path = "../../crates/rivet-server" }
rivet-serialization = { path = "../../crates/rivet-serialization" }
rivet-text = { path = "../../crates/rivet-text" }
rivet-util = { path = "../../crates/rivet-util" }
rivet-world = { path = "../../crates/rivet-world" }
# workspace serde_json carries `preserve_order` so JSON map insertion order is
# preserved — required for byte-identical component-JSON canonical compare
# against Paper's Gson output (issue #98).
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
