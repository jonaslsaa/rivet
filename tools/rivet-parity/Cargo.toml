[package]
name = "rivet-parity"
version = "0.1.0"
edition = "2024"
description = "Byte-for-byte NBT/SNBT parity diff between rivet-nbt and the Paper Java oracle"

[dependencies]
base64 = "0.22"
rivet-nbt = { path = "../../crates/rivet-nbt" }
rivet-util = { path = "../../crates/rivet-util" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
