# cargo-fuzz target crate for rivet parsers (rivet-nbt, rivet-serialization) and the
# rivet-protocol packet decode paths.
#
# These targets feed untrusted bytes into the SNBT `TagParser`, the binary NBT
# readers (`NbtIo`), and the DFU codec combinators over `NbtOps`. The packet
# targets (fuzz/fuzz_targets/packet_*.rs) exercise the protocol-layer packet
# decode codecs and are gated behind the `packets` feature (see below). Fuzzers
# run only on the nightly toolchain via `cargo fuzz` (the workspace itself pins
# stable 1.97.1 in rust-toolchain.toml — `cargo fuzz` overrides that for this
# crate). This crate is a workspace member, so `cargo fuzz build` does not need
# the `--no-default-features` / excluded-member dance.

[package]
name = "rivet-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license.workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = { workspace = true }
libfuzzer-sys = "0.4"
rivet-nbt = { path = "../crates/rivet-nbt" }
rivet-protocol = { path = "../crates/rivet-protocol" }
rivet-serialization = { path = "../crates/rivet-serialization" }
rivet-util = { path = "../crates/rivet-util" }
serde_json = { workspace = true }

# The `packets` feature forwards to `rivet-protocol/packets` (the generated
# packet-ID tables + packet bodies). The generic workspace invocation
# (gate.sh `--workspace`) does not enable it; the packet targets opt in with
# `cargo fuzz build --features packets`, and the gate type-checks/lints them
# explicitly via `cargo check/clippy -p rivet-fuzz --features packets`.
[features]
packets = ["rivet-protocol/packets"]

# The `src/lib.rs` library is the workspace-shared home of the factored
# target bodies (`targets`), the panic filter (`common`), seed discovery
# (`seeds`), and the deterministic seed regressions (`regress`, compiled only
# under `cargo test`). Each [[bin]] below is a thin shim handing raw bytes to
# the corresponding `targets::*` body, so libFuzzer and the regressions drive
# the exact same code. The library also lets `cargo test -p rivet-fuzz` build
# and run the regressions on the pinned stable toolchain — the bins stay
# `#![no_main]` (linked only by cargo-fuzz on nightly).
[lib]
name = "rivet_fuzz"
path = "src/lib.rs"

[[bin]]
name = "snbt"
path = "fuzz_targets/snbt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nbt_binary"
path = "fuzz_targets/nbt_binary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nbt_binary_visitor"
path = "fuzz_targets/nbt_binary_visitor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nbt_binary_roundtrip"
path = "fuzz_targets/nbt_binary_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "data_io_modified_utf8"
path = "fuzz_targets/data_io_modified_utf8.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codec_compressed_decode"
path = "fuzz_targets/codec_compressed_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snbt_roundtrip"
path = "fuzz_targets/snbt_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codec_decode"
path = "fuzz_targets/codec_decode.rs"
test = false
doc = false
bench = false

# rivet-protocol packet-decode targets (issue #46). The `packets` feature
# (rivet-protocol's generated tables + packet bodies) is enabled via this
# package's `packets` feature; these bins build under
# `cargo fuzz build --features packets`.
[[bin]]
name = "packet_status"
path = "fuzz_targets/packet_status.rs"
test = false
doc = false
bench = false
required-features = ["packets"]

[[bin]]
name = "packet_login"
path = "fuzz_targets/packet_login.rs"
test = false
doc = false
bench = false
required-features = ["packets"]

[[bin]]
name = "packet_configuration"
path = "fuzz_targets/packet_configuration.rs"
test = false
doc = false
bench = false
required-features = ["packets"]

[[bin]]
name = "packet_play"
path = "fuzz_targets/packet_play.rs"
test = false
doc = false
bench = false
required-features = ["packets"]

[[bin]]
name = "packet_client_information"
path = "fuzz_targets/packet_client_information.rs"
test = false
doc = false
bench = false
required-features = ["packets"]
