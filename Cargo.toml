[workspace]
resolver = "3"
members = ["crates/*", "tools/rivet-oracle"]
exclude = ["tools/rivet-codegen", "working"]

[workspace.package]
version = "0.1.0-dev+mc26.2"
edition = "2024"

# Library choices are documented in CRATES.md — add dependencies there first.
[workspace.dependencies]
rivet-core = { path = "crates/rivet-core" }
rivet-util = { path = "crates/rivet-util" }
rivet-nbt = { path = "crates/rivet-nbt" }
rivet-serialization = { path = "crates/rivet-serialization" }
rivet-text = { path = "crates/rivet-text" }
rivet-brigadier = { path = "crates/rivet-brigadier" }
rivet-registry = { path = "crates/rivet-registry" }
rivet-protocol = { path = "crates/rivet-protocol" }
rivet-world = { path = "crates/rivet-world" }
rivet-entity = { path = "crates/rivet-entity" }
rivet-api = { path = "crates/rivet-api" }

[workspace.lints.rust]
unsafe_code = "warn" # rivet-ffi overrides locally; see PORTING.md

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Faithful Java semantics require these (see PORTING.md, LESSONS-PUMPKIN.md):
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
float_cmp = "allow"

[profile.release]
lto = true
codegen-units = 1
