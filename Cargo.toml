[workspace]
resolver = "3"
members = ["crates/*", "tools/rivet-oracle", "tools/rivet-parity", "tools/rivet-capture", "tools/rivet-decode", "tools/rivet-nbt-inspect", "tools/rivet-harness-common", "fuzz"]
exclude = ["tools/rivet-codegen", "working"]

[workspace.package]
version = "0.1.0-dev+mc26.2"
edition = "2024"
license = "GPL-3.0-or-later"

# Library choices are documented in CRATES.md — add dependencies there first.
[workspace.dependencies]
base64 = "0.22"
bytes = "1"
crc32c = "0.6"
crossfire = "3"
flate2 = "1"
indexmap = "2"
md5 = "0.7"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rivet-api = { path = "crates/rivet-api" }
rivet-brigadier = { path = "crates/rivet-brigadier" }
rivet-core = { path = "crates/rivet-core" }
rivet-entity = { path = "crates/rivet-entity" }
rivet-nbt = { path = "crates/rivet-nbt" }
rivet-protocol = { path = "crates/rivet-protocol" }
rivet-registry = { path = "crates/rivet-registry" }
rivet-serialization = { path = "crates/rivet-serialization" }
rivet-text = { path = "crates/rivet-text" }
rivet-util = { path = "crates/rivet-util" }
rivet-world = { path = "crates/rivet-world" }
rayon = "1"
# Test-only tracing-subscriber machinery for asserting the RIVET_* trace
# records (issue #53). Dev-dependency of rivet-server only; nothing production
# links it (see crates/rivet-test-support).
rivet-test-support = { path = "crates/rivet-test-support" }
ryu = "1.0"
phf = "0.11"
serde_json = { version = "1", features = ["preserve_order"] }
# xxh3_64 for the #54 chunk-hash engine (rivet-oracle). Only the xxh3 feature
# is enabled — no xxh32/xxh64/xxh128 — so the digest family is exactly the one
# the known-answer self-check pins.
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"] }

[workspace.lints.rust]
unsafe_code = "warn" # rivet-ffi overrides locally; see PORTING.md

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Faithful Java semantics require these (see PORTING.md, LESSONS-PUMPKIN.md):
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
float_cmp = "allow"

[profile.release]
lto = true
codegen-units = 1
