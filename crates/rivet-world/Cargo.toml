[package]
name = "rivet-world"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "net.minecraft.world.level — chunks, sections, paletted containers (wire formats; #108 M1)"

[lints]
workspace = true

[dependencies]
# `FriendlyByteBuf` (and the section/data-layer buffers it fills) is BytesMut-
# backed; the #100 superflat content builder writes sections through it.
bytes = { workspace = true }
# `StructureAccess`'s reference sets stand in for Java's `LongOpenHashSet`
# (insertion-ordered, deduplicating).
indexmap = { workspace = true }
# The `packets` feature unlocks the game packet bodies this crate produces
# content for (#94): `LevelChunkPacketData`, `LightUpdatePacketData`,
# `HeightmapType` (all feature-gated in rivet-protocol).
rivet-protocol = { workspace = true, features = ["packets"] }
rivet-registry = { workspace = true }
rivet-util = { workspace = true }

[dev-dependencies]
# Tests build real containers (BytesMut-backed FriendlyByteBuf).
bytes = { workspace = true }
# The section-tag decode test builds a `SerializableChunkData`-style section
# `CompoundTag` (`Y` + `block_states`/`biomes`; the golden fixture carries no
# light arrays).
rivet-nbt = { workspace = true }
# The PalettedContainer<StateId> golden tests drive the real global
# block-state table (rivet-registry `blocks` feature). Dev-only: normal
# builds of rivet-world stay feature-free.
rivet-registry = { workspace = true, features = ["blocks"] }
