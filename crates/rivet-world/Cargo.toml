[package]
name = "rivet-world"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "net.minecraft.world.level — chunks, sections, paletted containers (wire formats; #108 M1)"

[lints]
workspace = true

[dependencies]
# `FriendlyByteBuf` (and the section/data-layer buffers it fills) is BytesMut-
# backed; the #100 superflat content builder writes sections through it.
bytes = { workspace = true }
# Region-file codecs (#231, `world.level.chunk.storage`): gzip/deflate read and
# gzip write ride on flate2 (gzip proven via rivet-nbt); lz4 read/write and
# deflate write are deferred (see CRATES.md).
flate2 = { workspace = true }
# `StructureAccess`'s reference sets are an `IndexSet<u64>` — the Rust stand-in
# for Java's `LongOpenHashSet`. Dedup and first-insertion order are the
# IndexSet's, not Java's (which iterates in hash-probe slot order; see the
# module `RivetTodo(#185)` in structure_access).
indexmap = { workspace = true }
# The `packets` feature unlocks the game packet bodies this crate produces
# content for (#94): `LevelChunkPacketData`, `LightUpdatePacketData`,
# `HeightmapType` (all feature-gated in rivet-protocol).
rivet-protocol = { workspace = true, features = ["packets"] }
rivet-registry = { workspace = true }
# The chunk-access carrier types hold `CompoundTag`s (`ChunkAccess` pending
# block entities, `ProtoChunk` entities) and the `UpgradeData`/`ProtoChunk`
# read `CompoundTag`; rivet-nbt is now a production dependency.
rivet-nbt = { workspace = true }
rivet-util = { workspace = true }

[dev-dependencies]
# Tests build real containers (BytesMut-backed FriendlyByteBuf).
bytes = { workspace = true }
# The PalettedContainer<StateId> golden tests drive the real global
# block-state table (rivet-registry `blocks` feature). Dev-only: normal
# builds of rivet-world stay feature-free.
rivet-registry = { workspace = true, features = ["blocks"] }
