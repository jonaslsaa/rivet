[package]
name = "rivet-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytes = { workspace = true }
# `phf` names the generated `*_TAG_BY_NAME`/`*_BY_NAME` table types in
# `registry_sync` (the tables themselves live in rivet-registry behind `blocks`).
phf = { workspace = true }
rivet-protocol = { workspace = true, features = ["packets"] }
# `blocks` enables the generated element tables the configuration registry sync
# consumes (`generated::synchronized`, `generated::tags`, `generated::biomes`,
# `generated::blocks`, `generated::registries` — OWNERSHIP.md §Registries).
rivet-registry = { workspace = true, features = ["blocks"] }
rivet-util = { workspace = true }
thiserror = { workspace = true }
# `signal` is only used by the binary (SIGTERM clean shutdown); the library's
# own tests do not need it.
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# Building compressed wire frames in the offline-login integration tests
# (zlib-encoding the client's `login_acknowledged`).
flate2 = { workspace = true }

[lints]
workspace = true
