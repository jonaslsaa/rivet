[package]
name = "rivet-util"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
crc32c = { workspace = true }
# `ProblemReporter.Collector.getReport` groups problems by path string. Java
# groups through a Guava `HashMultimap` — a `HashMap`-backed set multimap, so
# the group order is unspecified and identical (path, problem) pairs appear
# once. The port uses an ordered map so the report is deterministic: first-seen
# path order (a superset of Java's unordered groups), with duplicate
# descriptions within a path dropped to match Java's de-duplication.
indexmap = { workspace = true }
md5 = { workspace = true }
sha2 = { workspace = true }
rivet-serialization = { workspace = true }

[dev-dependencies]
# Codec round-trip tests drive `xoroshiro128plusplus_codec` through
# `JsonOps::INSTANCE` (serde_json::Value backed), the same ops the DFU
# codecs in `rivet-registry`/`rivet-world` run on.
serde_json = { workspace = true }
