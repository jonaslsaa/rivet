[package]
name = "rivet-protocol"
version.workspace = true
edition.workspace = true
description = "Minecraft protocol layer: packet-ID tables (generated by tools/rivet-codegen), then packet bodies + registration (epic #10)"

[dependencies]
bytes = { workspace = true }
cesu8 = { workspace = true }
rivet-nbt = { workspace = true }
rivet-serialization = { workspace = true }
rivet-util = { workspace = true }
phf = { workspace = true, features = ["macros"], optional = true }

[features]
default = []
# Compile-time packet-ID tables (src/generated), generated by
# tools/rivet-codegen from data/reports/packets.json. Off by default so
# consumers only pay for what they use.
packets = ["dep:phf"]

[[test]]
name = "packet_tables"
# Exercises the generated tables; only meaningful when the feature is on.
required-features = ["packets"]

[lints]
workspace = true
