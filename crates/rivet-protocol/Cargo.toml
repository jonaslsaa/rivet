[package]
name = "rivet-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Minecraft protocol layer: packet-ID tables (generated by tools/rivet-codegen), then packet bodies + registration (epic #10)"

[dependencies]
bytes = { workspace = true }
cesu8 = { workspace = true }
flate2 = { workspace = true }
rivet-nbt = { workspace = true }
# `rivet-protocol → rivet-registry` (OWNERSHIP.md §Registries; never the
# reverse). The registry-aware protocol codecs (Identifier/ResourceKey/TagKey/
# Holder/HolderSet stream codecs, #126 phase G) and `PacketType`'s
# `Identifier` wrapper both need the registry key/holder types, so the
# dependency is unconditional (the codec surface is not feature-gated).
rivet-registry = { workspace = true }
rivet-serialization = { workspace = true }
rivet-util = { workspace = true }
phf = { workspace = true, features = ["macros"], optional = true }

[features]
default = []
# Compile-time packet-ID tables (src/generated), generated by
# tools/rivet-codegen from data/reports/packets.json. Off by default so
# consumers only pay for what they use.
packets = ["dep:phf"]

[[test]]
name = "packet_tables"
# Exercises the generated tables; only meaningful when the feature is on.
required-features = ["packets"]

[[test]]
name = "protocol_registration"
# Exercises the registration machinery (protocol module); only meaningful
# when the packet tables (the state/direction enums) are on.
required-features = ["packets"]

[[test]]
name = "serversbound_play"
# Exercises the issue #97 serverbound play packet bodies (game module), which
# live behind the packets feature.
required-features = ["packets"]

[lints]
workspace = true
