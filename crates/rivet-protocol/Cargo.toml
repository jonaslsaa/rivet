[package]
name = "rivet-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Minecraft protocol layer: packet-ID tables (generated by tools/rivet-codegen), then packet bodies + registration (epic #10)"

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
rivet-nbt = { workspace = true }
# `rivet-protocol → rivet-registry` (OWNERSHIP.md §Registries; never the
# reverse). The registry-aware protocol codecs (Identifier/ResourceKey/TagKey/
# Holder/HolderSet stream codecs, #126 phase G) and `PacketType`'s
# `Identifier` wrapper both need the registry key/holder types, so the
# dependency is unconditional (the codec surface is not feature-gated).
rivet-registry = { workspace = true }
rivet-serialization = { workspace = true }
rivet-text = { workspace = true }
rivet-util = { workspace = true }
serde_json = { workspace = true }
phf = { workspace = true, features = ["macros"], optional = true }

[features]
default = []
# Compile-time packet-ID tables (src/generated), generated by
# tools/rivet-codegen from data/reports/packets.json. Off by default so
# consumers only pay for what they use.
packets = ["dep:phf"]

[[test]]
name = "packet_tables"
# Exercises the generated tables; only meaningful when the feature is on.
required-features = ["packets"]

[[test]]
name = "protocol_registration"
# Exercises the registration machinery (protocol module); only meaningful
# when the packet tables (the state/direction enums) are on.
required-features = ["packets"]

[[test]]
name = "serversbound_play"
# Exercises the issue #97 serverbound play packet bodies (game module), which
# live behind the packets feature.
required-features = ["packets"]

[[test]]
name = "client_information_registration"
# Exercises the real ServerboundClientInformationPacket body codec through the
# id-dispatch registration machinery (issue #197); the generated packet-ID
# tables pin its configuration id 0 / play id 14 slots.
required-features = ["packets"]

[[test]]
name = "entity_pairing_packets"
# Exercises the issue #90 clientbound entity-pairing packet bodies + the
# syncher wire model (game + syncher modules), which live behind the packets
# feature.
required-features = ["packets"]

[[test]]
name = "login_packets"
# Exercises the issue #99 offline login packet bodies (login module), which
# live behind the packets feature. Pins the captured golden bodies and the
# LoginProtocols addPacket-order ids.
required-features = ["packets"]

[[test]]
name = "configuration_packets"
# Exercises the issue #109 configuration-phase packet bodies (configuration +
# common modules), which live behind the packets feature. Decodes the pinned
# #194/#219 golden capture bodies and pins the registration ids.
required-features = ["packets"]

[[test]]
name = "join_clientbound"
# Exercises the issue #87 join clientbound packet bodies (game module), which
# live behind the packets feature. Decodes the pinned #153 join-capture golden
# bodies byte-exactly and pins the GamePacketTypes addPacket-order ids.
required-features = ["packets"]

[lints]
workspace = true
