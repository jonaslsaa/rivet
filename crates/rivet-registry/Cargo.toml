[package]
name = "rivet-registry"
version.workspace = true
edition.workspace = true
description = "Vanilla data registries, generated by tools/rivet-codegen (epic #8)"

[dependencies]
phf = { workspace = true, features = ["macros"], optional = true }

[features]
default = []
# Compile-time block registry + block-state tables (src/generated), generated
# by tools/rivet-codegen. Off by default so consumers only pay for what they use.
blocks = ["dep:phf"]

[lints]
workspace = true
