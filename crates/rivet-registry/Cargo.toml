[package]
name = "rivet-registry"
version.workspace = true
edition.workspace = true
description = "Vanilla data registries, generated by tools/rivet-codegen (epic #8) + the #124 registry SCC and #125 position SCC (M1-A)"

# ---- M1-A registry + position SCC scaffold ownership -------------------------
# SCREEN SHARED (scaffold-owned — registry modules from the #124 PR; the #125
# position SCC appends `pub mod core` to lib.rs and owns src/core/*):
#   - this manifest
#   - src/lib.rs (registry modules #124; the `core` section #125)
#   - src/generated/mod.rs (generated wiring; edited by tools/rivet-codegen only)
# SCREEN OWNED (unit-owned, translated by the #124 units):
#   A resources/keys   -> src/identifier.rs, resource_key.rs, tag_key.rs,
#                         registries.rs, registration_info.rs,
#                         identifier_exception.rs   (mc.core.registries.Registries
#                         + mc.resources + mc.tags + net.minecraft.IdentifierException)
#   B lifecycle        -> src/registry.rs, builder.rs, id_map.rs, holder.rs,
#                         registration_info.rs
#                         (mc.core: Registry/RegistryBuilder/MappedRegistry/
#                         DefaultedRegistry/IdMap)
#   C access/provider  -> src/access.rs, src/root.rs, src/game_data.rs,
#                         src/block_id_tests.rs   (OUTSIDE generated/, which is
#                         codegen-owned and must stay byte-identical)
#   D serialization    -> src/registry_ops.rs
#                         (mc.resources: RegistryOps + DelegatingOps pieces)
# #125 position SCC (issue #125) owns src/core/* (registry-independent
# net.minecraft.core value types) + `tests/position.rs`; it adds no new
# dependencies (core value types need only rivet-util, already present).
#
# #126 (holder codecs) adds holder.rs/holder_set.rs/holder_lookup.rs +
# registry_file_codec.rs, wiring them in lib.rs (shared). Sanctioned touches to
# the SCC-owned modules above:
#   - registry_ops.rs (D): the holder-view placeholders (HolderOwner/
#     HolderGetter structs) are replaced by the real holder_lookup views
#     (RegistryOwner/RegistryGetter), and retrieve_element now returns
#     Holder.Reference<E>.
#   - root.rs (C): `AnyRegistry` gains `registry_id()` so the RegistryOps owner
#     view can read the per-instance RegistryId through the erased boundary.
#   - registry.rs / builder.rs (B): doc-only updates pointing at the #126 holder
#     surface.
# Everything else is new module files + Cargo feature flags that the SCC units
# already declared.
[dependencies]
phf = { workspace = true, features = ["macros"], optional = true }
rivet-core = { workspace = true }
rivet-serialization = { workspace = true }
rivet-util = { workspace = true }

[dev-dependencies]
# Codec round-trip tests drive `RegistryFileCodec`/`HolderSetCodec` through a
# real `RegistryOps` over `JsonOps` (the same ops the codecs run on in
# `rivet-data`); the workspace `serde_json` is already used by
# `rivet-serialization::json_ops`.
serde_json = { workspace = true }

[features]
default = []
# Compile-time block registry + block-state tables (src/generated), generated
# by tools/rivet-codegen. Off by default so consumers only pay for what they use.
blocks = ["dep:phf"]

[lints]
workspace = true
